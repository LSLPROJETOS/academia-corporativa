<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Academia Corporativa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ===== CORES, FONTES E TEMAS (claro e escuro). Mude aqui para trocar o visual. ===== */
:root{--bg:#f3f5f4;--panel:#fff;--ink:#12263a;--muted:#5b6b7a;--line:#d9e0e3;--brand:#0b6e5f;--link:var(--brand);
--soft:color-mix(in srgb,var(--brand) 12%,transparent);--top:#12263a;--coin:#f5b700;--danger:#b3261e;--warn:#9a5b00;--ok:#1b7f3b;
--radius:12px;--font-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--font-head:"Sora","Public Sans",system-ui,sans-serif}
[data-theme=dark]{--bg:#0f1720;--panel:#17212c;--ink:#e6edf3;--muted:#9aa9b6;--line:#2a3846;--top:#0a1118;
--link:color-mix(in srgb,var(--brand) 55%,white);--soft:color-mix(in srgb,var(--brand) 28%,transparent);--danger:#ff8a80;--warn:#ffc266;--ok:#6fdc8c}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--font-body)}
h1,h2,h3{font-family:var(--font-head);line-height:1.2;margin:0 0 .5em}
h1{font-size:1.7rem}h2{font-size:1.2rem}h3{font-size:1.02rem}
a{color:var(--link)}
:focus-visible{outline:3px solid var(--coin);outline-offset:2px}
.muted{color:var(--muted)}.small{font-size:.85rem}.hide{display:none!important}
.container{max-width:1180px;margin:0 auto;padding:24px 16px 72px}

/* ===== BARRA SUPERIOR: marca, menu, pontos, notificações ===== */
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--top);color:#fff;padding:8px 18px;position:sticky;top:0;z-index:5}
.brand{font:600 1.05rem var(--font-head);color:#fff;text-decoration:none;margin-right:8px}
#nav{display:flex;gap:2px;flex-wrap:wrap;flex:1}
#nav a{color:#dfe8ee;text-decoration:none;padding:6px 12px;border-radius:8px}
#nav a:hover,#nav a.active{background:rgba(255,255,255,.14);color:#fff}
#user-area{display:flex;align-items:center;gap:6px}
.menu-btn{display:none}
.icon-btn,.link-btn,.menu-btn{position:relative;background:none;border:0;color:#dfe8ee;font:inherit;cursor:pointer;padding:6px 10px;border-radius:8px;text-decoration:none}
.icon-btn:hover,.link-btn:hover,.menu-btn:hover{background:rgba(255,255,255,.14)}
.dot{position:absolute;top:0;right:0;background:var(--danger);color:#fff;font-size:.65rem;border-radius:99px;padding:0 5px;min-width:16px;text-align:center}
.user-link{display:flex;align-items:center;gap:8px;color:#fff;text-decoration:none;padding:2px 8px;border-radius:8px}
.user-link:hover{background:rgba(255,255,255,.14)}
.chip.coins{display:inline-flex;align-items:center;gap:8px;padding:3px 12px 3px 4px;border-radius:999px;background:rgba(245,183,0,.16);color:#ffd966;font:600 .9rem var(--font-head);text-decoration:none}
.chip.coins::before{content:"";width:22px;height:22px;border-radius:50%;background:var(--coin);box-shadow:inset 0 0 0 4px #ffd966,inset 0 0 0 6px #c99700}
.avatar{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;color:#fff;font:600 .9rem var(--font-head);flex:none}
.avatar.sm{width:28px;height:28px;font-size:.7rem}.avatar.lg{width:72px;height:72px;font-size:1.5rem}

/* ===== BOTÕES E FORMULÁRIOS ===== */
.btn{display:inline-block;padding:9px 16px;border-radius:8px;border:1px solid var(--brand);background:var(--brand);color:#fff;font:600 .93rem var(--font-body);cursor:pointer;text-decoration:none;text-align:center}
.btn:hover{filter:brightness(1.1)}.btn:disabled,.btn[aria-disabled=true]{opacity:.5;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--link);border-color:var(--line)}
.btn.danger{background:transparent;color:var(--danger);border-color:var(--danger)}
.btn.small{padding:4px 10px;font-size:.82rem}
.btn.gold{background:var(--coin);border-color:var(--coin);color:#3d2d00}
label{display:block;font-weight:500;margin-bottom:12px;font-size:.93rem}
label.check{display:flex;gap:8px;align-items:center}
input,select,textarea{display:block;width:100%;margin-top:4px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font:inherit;background:var(--panel);color:var(--ink)}
input[type=checkbox],input[type=radio]{width:auto;margin:0}
input[type=color]{padding:2px;height:40px}
textarea{min-height:90px;resize:vertical}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1 1 170px}
.actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

/* ===== CAIXAS, CARTÕES, TAGS, BARRAS ===== */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:20px}
.page-head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.grid.sm{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.card{display:flex;flex-direction:column;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;color:inherit}
.card.course,.card.click{cursor:pointer}.card.course:hover,.card.click:hover{border-color:var(--brand)}
.card h3 a{color:var(--ink);text-decoration:none}
.cover{position:relative;height:96px;border-radius:8px;display:grid;place-items:center;font-size:2.6rem;background:linear-gradient(135deg,hsl(var(--h) 45% 38%),hsl(calc(var(--h) + 40) 50% 28%))}
.fav{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.35);color:#fff;border:0;border-radius:99px;width:30px;height:30px;font-size:1rem;cursor:pointer}.fav.on{color:var(--coin)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{display:inline-block;font-size:.75rem;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--soft);color:var(--link)}
.tag.service{background:#fff1cc;color:#7a5a00}.tag.bad{background:#fde3e1;color:#a11d14}.tag.warn{background:#ffe9c7;color:#8a5200}.tag.ok{background:#dcf3e2;color:#17692f}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:0}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}.bar>span{display:block;height:100%;background:var(--brand);transition:width .3s}
.bar.gold>span{background:var(--coin)}
.price{font:700 1.15rem var(--font-head)}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.notice{background:#fff1cc;color:#5c4400;border-radius:8px;padding:10px 12px;margin-bottom:14px;font-size:.92rem}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.stat b{display:block;font:700 1.6rem var(--font-head)}.stat span{color:var(--muted);font-size:.85rem}
.hero{display:flex;gap:20px;flex-wrap:wrap;align-items:center;background:linear-gradient(135deg,var(--brand),color-mix(in srgb,var(--brand) 55%,#000));color:#fff;border-radius:var(--radius);padding:22px;margin-bottom:20px}
.hero .bar{background:rgba(255,255,255,.25);width:100%}.hero .bar>span{background:var(--coin)}
.hero h1{margin:0}.hero .grow{flex:1 1 280px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.badge{border:1px solid var(--line);border-radius:var(--radius);padding:12px;text-align:center;background:var(--panel)}
.badge .ic{font-size:2rem}.badge.locked{opacity:.45;filter:grayscale(1)}
.stars button{background:none;border:0;font-size:1.5rem;cursor:pointer;color:var(--line);padding:0 2px}.stars button.on{color:var(--coin)}

/* ===== TABS E TABELAS ===== */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tabs a,.tabs button{padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font:inherit;cursor:pointer;color:var(--ink);text-decoration:none}
.tabs .on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-weight:600;color:var(--muted);white-space:nowrap}
tr.me td{background:var(--soft)}

/* ===== PÁGINA DO CURSO: player, aulas, texto ===== */
.course-layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.player{width:100%;aspect-ratio:16/9;background:#000;border-radius:var(--radius);border:0}
.prose{line-height:1.7}.prose ul{padding-left:20px}
.lessons{list-style:none;margin:0;padding:0}
.lessons .mod{font:600 .78rem var(--font-body);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:10px 4px 4px}
.lessons li.l{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.lessons li.l:hover{background:var(--bg)}.lessons li.active{border-color:var(--brand);background:var(--soft)}
.lessons li.locked{opacity:.5;cursor:not-allowed}
.lessons .check{width:20px;height:20px;flex:none;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.7rem}
.lessons li.done .check{background:var(--brand);border-color:var(--brand);color:#fff}
.lessons .pts{margin-left:auto;font-size:.75rem;color:var(--muted);white-space:nowrap}
.comment{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.comment .reply{margin-left:44px}
.q{border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:14px}
.q label.opt{display:flex;gap:8px;align-items:flex-start;font-weight:400;padding:6px 8px;border-radius:8px;margin:0}
.q label.opt:hover{background:var(--soft)}.q .right{background:#dcf3e2;color:#17692f}.q .wrong{background:#fde3e1;color:#a11d14}

/* ===== GRÁFICOS SIMPLES (painel) ===== */
.vbars{display:flex;align-items:flex-end;gap:6px;height:150px}
.vbars>div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:4px}
.vbars .b{width:100%;background:var(--brand);border-radius:4px 4px 0 0;min-height:2px}.vbars small{font-size:.68rem;color:var(--muted)}
.hbar{display:grid;grid-template-columns:minmax(120px,200px) 1fr 44px;gap:10px;align-items:center;margin-bottom:8px;font-size:.88rem}

/* ===== TELA DE LOGIN, JANELAS (modal) E AVISOS ===== */
.auth{max-width:420px;margin:36px auto}
dialog{border:1px solid var(--line);border-radius:var(--radius);padding:0;width:min(560px,94vw);background:var(--panel);color:var(--ink)}
dialog.wide{width:min(820px,96vw)}dialog::backdrop{background:rgba(0,0,0,.5)}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal-head h2{margin:0}.modal-head .icon-btn{color:var(--ink)}
#modal-body{padding:18px;max-height:78vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#12263a;color:#fff;padding:10px 18px;border-radius:10px;z-index:20;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.toast.error{background:var(--danger);color:#fff}

/* ===== CERTIFICADO (também formata a impressão) ===== */
.cert{border:10px double var(--brand);padding:44px 30px;text-align:center;background:#fff;color:#12263a;max-width:900px;margin:0 auto}
.cert h1{font-size:2.2rem;color:var(--brand)}.cert .name{font:700 2rem var(--font-head);margin:14px 0;border-bottom:2px solid #12263a;display:inline-block;padding:0 24px}
@media print{.topbar,.no-print,.toast{display:none!important}body{background:#fff}.container{padding:0;max-width:none}}
@page{size:A4 landscape;margin:12mm}

/* ===== CELULAR ===== */
@media(max-width:860px){.course-layout{grid-template-columns:1fr}.menu-btn{display:block;margin-left:auto}
#nav,#user-area{display:none;width:100%}.topbar.open #nav{display:flex;flex-direction:column}.topbar.open #user-area{display:flex;flex-wrap:wrap}.hide-sm{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<!-- BARRA SUPERIOR: marca, menu e área do usuário (preenchidos pelo JavaScript) -->
<header class="topbar" id="topbar">
  <a class="brand" id="brand" href="#/home">Academia Corporativa</a>
  <button class="menu-btn" data-action="menu" aria-label="Abrir menu">☰</button>
  <nav id="nav" aria-label="Principal"></nav>
  <div id="user-area"></div>
</header>
<!-- ÁREA PRINCIPAL: cada tela é desenhada aqui -->
<main id="app" class="container" aria-live="polite"></main>
<!-- JANELA (modal) usada por formulários de criar/editar -->
<dialog id="modal">
  <div class="modal-head"><h2 id="modal-title"></h2><button class="icon-btn" data-action="close" aria-label="Fechar">✕</button></div>
  <div id="modal-body"></div>
</dialog>
<!-- AVISO rápido (sucesso/erro) -->
<div id="toast" class="toast" role="status" hidden></div>
<script>
'use strict';
// ============================================================================
// MAPA DO CÓDIGO
//  1. DADOS .......... estado compartilhado no Supabase e arquivos no Storage
//  2. SEGURANÇA ...... senhas embaralhadas (hash), regras de senha, permissões
//  3. AUXILIARES ..... funções pequenas usadas em todo o código
//  4. REGRAS ......... pontos, níveis, conquistas, progresso, certificados, check-in
//  5. DEMONSTRAÇÃO ... botão que cria cursos, produtos e usuários de exemplo
//  6. NAVEGAÇÃO ...... menu, tema, roteador e login/cadastro
//  7. TELAS DO ALUNO . início, cursos, curso, prova, certificado, loja, ranking, perfil
//  8. TELAS DE ADMIN . painel, usuários, grupos, cursos, loja, trocas, relatórios...
//  9. EVENTOS ........ o que acontece em cada clique, formulário e digitação
// ============================================================================

// ============================================================================
// 1. DADOS
// ============================================================================
const SUPABASE_URL = 'https://nkwizwwsuulvdenxzllh.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_ZLJxCL3FFxM2AfFETGzqeg_NSRiNsdd';
const LOCAL_MODE = false;
const backend = LOCAL_MODE ? null : window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
const LOCAL_STATE_KEY = 'academia-corporativa-local-state';
const LOCAL_PASSWORDS_KEY = 'academia-corporativa-local-passwords';
const LOCAL_SESSION_KEY = 'academia-corporativa-local-session';

// Estado inicial. Cada lista funciona como uma tabela de banco de dados.
const DEFAULTS = () => ({
  settings: { platformName: 'Academia Corporativa', accent: '#0b6e5f', openSignup: true, requireApproval: false,
    pointsPerLesson: 10, courseBonus: 50, quizPassBonus: 30, dailyBonus: 5, streak7Bonus: 50, levelStep: 100, minWatchPct: 90 },
  depts: ['Atendimento', 'Vendas', 'Operações', 'Financeiro', 'RH'], // departamentos/grupos
  users: [],          // usuários (aluno, instrutor, admin)
  courses: [],        // cursos e padrões de serviço
  lessons: [],        // aulas (vídeo, link ou texto) ligadas a um curso
  quizzes: [],        // prova de cada curso
  enrollments: [],    // inscrições (com prazo opcional)
  progress: [],       // aulas concluídas por usuário
  watch: {},          // posição e trechos assistidos de cada vídeo, por usuário
  attempts: [],       // tentativas de prova
  certificates: [],   // certificados emitidos
  ratings: [], comments: [], notes: {}, favorites: [],
  products: [], redemptions: [],   // loja e pedidos de troca
  log: [],            // histórico de pontos
  notifications: [], announcements: [], audit: [], seq: 1
});

// O estado de trabalho é local durante a montagem da interface; o Supabase fica para depois.
let S = DEFAULTS();
let sessionId = null, sessionAuthId = null, backendReady = false, remoteReady = false;
let saveTimer = null, saveQueue = Promise.resolve();
let localPasswords = {};

// Gravações locais persistem no navegador. O modo remoto continua disponível para configuração futura.
function save() {
  if (LOCAL_MODE) {
    try { localStorage.setItem(LOCAL_STATE_KEY, JSON.stringify(S)); }
    catch (error) { toast(`Não foi possível salvar neste navegador: ${error.message}`, true); }
  } else if (remoteReady) scheduleRemoteSave();
}

const nid = () => { const r = crypto.getRandomValues(new Uint32Array(2)); return r[0] * 2097152 + (r[1] >>> 11); };
async function hashLocalPassword(password, salt = crypto.getRandomValues(new Uint8Array(16))) {
  const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt, iterations: 120000, hash: 'SHA-256' }, key, 256);
  const hex = (bytes) => [...new Uint8Array(bytes)].map((b) => b.toString(16).padStart(2, '0')).join('');
  return `${hex(salt)}:${hex(bits)}`;
}
async function verifyLocalPassword(password, stored) {
  const [saltHex, expected] = (stored || '').split(':');
  if (!/^[0-9a-f]{32}$/i.test(saltHex || '') || !/^[0-9a-f]{64}$/i.test(expected || '')) return false;
  const salt = new Uint8Array(saltHex.match(/.{2}/g).map((byte) => parseInt(byte, 16)));
  return (await hashLocalPassword(password, salt)).split(':')[1] === expected;
}

// ---------- Arquivos grandes (vídeos, materiais) no IndexedDB ----------
function idb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('plataforma-completa', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('files');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function idbOp(mode, fn) {
  const db = await idb();
  return new Promise((res, rej) => {
    const tx = db.transaction('files', mode);
    const req = fn(tx.objectStore('files'));
    tx.oncomplete = () => res(req && req.result);
    tx.onerror = () => rej(tx.error);
  });
}
const idbPut = (id, blob) => idbOp('readwrite', (s) => s.put(blob, id));
const idbGet = (id) => idbOp('readonly', (s) => s.get(id));
const idbDel = (id) => idbOp('readwrite', (s) => s.delete(id));

const sharedCollections = ['courses', 'lessons', 'quizzes', 'products', 'announcements', 'audit'];
const privateCollections = ['enrollments', 'progress', 'watch', 'attempts', 'certificates', 'ratings', 'comments', 'notes', 'favorites', 'redemptions', 'log', 'notifications'];
const simpleCollections = ['courses', 'lessons', 'quizzes', 'products', 'announcements', 'enrollments', 'progress', 'attempts', 'certificates', 'ratings', 'comments', 'favorites', 'redemptions', 'log', 'notifications', 'audit'];
const profileSnapshots = new Map();
const remoteRecordSnapshots = new Map();
const remoteRecordKey = (collection, ownerId, recordId) => `${collection}\u0000${ownerId || ''}\u0000${recordId}`;
function stableJSON(value) {
  if (Array.isArray(value)) return `[${value.map(stableJSON).join(',')}]`;
  if (value && typeof value === 'object') return `{${Object.keys(value).sort().map((key) => `${JSON.stringify(key)}:${stableJSON(value[key])}`).join(',')}}`;
  return JSON.stringify(value);
}

function profileFromRow(row) {
  return {
    id: Number(row.internal_id), authId: row.id || row.profile_id, name: row.name || '', email: row.email || '',
    role: row.role || 'aluno', dept: row.dept || '', jobTitle: row.job_title || '', active: row.active !== false,
    pending: !!row.pending, points: Number(row.points) || 0, xp: Number(row.xp) || 0,
    badges: row.badges || [], theme: row.theme || 'auto', createdAt: Date.parse(row.created_at) || Date.now(),
    lastLogin: row.last_login ? Date.parse(row.last_login) : null, streak: Number(row.streak) || 0,
    lastCheckin: row.last_checkin || null, fails: 0, lockUntil: 0, mustChange: false
  };
}

function profileSnapshot(profile, staff = isStaff()) {
  const snapshot = {
    name: profile.name, dept: profile.dept, jobTitle: profile.jobTitle, theme: profile.theme,
    points: profile.points, xp: profile.xp, badges: profile.badges, streak: profile.streak, lastCheckin: profile.lastCheckin
  };
  if (staff) Object.assign(snapshot, { role: profile.role, active: profile.active, pending: profile.pending });
  return JSON.stringify(snapshot);
}

function recordId(collection, item, index) {
  if (item.id != null) return String(item.id);
  if (item.code) return String(item.code);
  if (item.courseId != null && ['quizzes', 'enrollments', 'favorites', 'ratings'].includes(collection))
    return collection === 'quizzes' ? String(item.courseId) : `${item.userId}:${item.courseId}`;
  if (collection === 'progress') return `${item.userId}:${item.lessonId}`;
  return `${item.userId || 'shared'}:${item.at || 0}:${index}`;
}

function ownerAuthId(internalId) {
  const profile = S.users.find((x) => x.id === Number(internalId));
  return profile?.authId || (Number(internalId) === sessionId ? sessionAuthId : null);
}

function rowsForCollection(collection) {
  if (collection === 'settings') return [{ record_id: 'platform', owner_id: null, payload: S.settings }];
  if (collection === 'departments') return S.depts.map((name) => ({ record_id: name, owner_id: null, payload: { name } }));
  if (collection === 'watch' || collection === 'notes') {
    return Object.entries(S[collection]).map(([key, value]) => {
      const internalId = Number(key.split(':')[0]);
      const owner_id = ownerAuthId(internalId);
      return owner_id ? { record_id: key, owner_id, payload: { userId: internalId, value } } : null;
    }).filter(Boolean);
  }
  return (S[collection] || []).map((item, index) => {
    if (sharedCollections.includes(collection)) return { record_id: recordId(collection, item, index), owner_id: null, payload: item };
    const owner_id = ownerAuthId(item.userId);
    if (!isStaff() && owner_id !== sessionAuthId) return null;
    return owner_id ? { record_id: recordId(collection, item, index), owner_id, payload: item } : null;
  }).filter(Boolean);
}

function hydrateRecords(records) {
  const mapped = Object.fromEntries(records.map((r) => [r.collection, r.payload]));
  for (const collection of simpleCollections) S[collection] = records.filter((r) => r.collection === collection).map((r) => r.payload);
  if (mapped.settings) S.settings = { ...S.settings, ...mapped.settings };
  const departments = records.filter((r) => r.collection === 'departments').map((r) => r.payload.name);
  if (departments.length) S.depts = departments;
  S.watch = Object.fromEntries(records.filter((r) => r.collection === 'watch').map((r) => [r.record_id, r.payload.value]));
  S.notes = Object.fromEntries(records.filter((r) => r.collection === 'notes').map((r) => [r.record_id, r.payload.value]));
}

async function loadRemoteState(authUser) {
  const { data: own, error: ownError } = await backend.from('profiles').select('*').eq('id', authUser.id).single();
  if (ownError || !own) throw new Error('Não foi possível carregar o perfil da conta. Execute supabase/schema.sql no projeto.');
  if (!own.active || own.pending) {
    const message = own.pending ? 'A conta aguarda aprovação.' : 'A conta está desativada. Fale com o administrador.';
    S = DEFAULTS(); sessionId = null; sessionAuthId = null; remoteReady = false;
    await backend.auth.signOut();
    await loadPublicConfig(); toast(message, true); return false;
  }
  sessionAuthId = authUser.id;
  sessionId = Number(own.internal_id);
  profileSnapshots.clear();
  S = DEFAULTS();
  const { data: directory, error: directoryError } = await backend.from('member_directory').select('*');
  if (directoryError) throw directoryError;
  S.users = (directory || []).map(profileFromRow);
  const ownProfile = profileFromRow(own);
  const ownIndex = S.users.findIndex((x) => x.id === ownProfile.id);
  if (ownIndex < 0) S.users.push(ownProfile); else S.users[ownIndex] = ownProfile;
  if (['admin', 'instrutor'].includes(own.role)) {
    const { data: profiles, error: profilesError } = await backend.from('profiles').select('*');
    if (profilesError) throw profilesError;
    S.users = (profiles || []).map(profileFromRow);
  }
  S.users.forEach((profile) => profileSnapshots.set(profile.authId, profileSnapshot(profile)));
  const { data: records, error: recordsError } = await backend.from('app_records').select('id,collection,record_id,owner_id,payload').range(0, 9999);
  if (recordsError) throw recordsError;
  remoteRecordSnapshots.clear();
  (records || []).forEach((row) => remoteRecordSnapshots.set(remoteRecordKey(row.collection, row.owner_id, row.record_id), { ...row, snapshot: stableJSON(row.payload) }));
  hydrateRecords(records || []);
  remoteReady = true;
  return true;
}

async function loadPublicConfig() {
  S = DEFAULTS();
  const { data, error } = await backend.from('app_records').select('collection,payload')
    .is('owner_id', null).in('collection', ['settings', 'departments']).range(0, 1000);
  if (error?.code === 'PGRST205') throw new Error('Banco ainda não configurado. Execute supabase/schema.sql no SQL Editor do projeto e recarregue esta página.');
  if (error) throw error;
  const settings = (data || []).find((row) => row.collection === 'settings')?.payload;
  if (settings) S.settings = { ...S.settings, ...settings };
  const departments = (data || []).filter((row) => row.collection === 'departments').map((row) => row.payload.name);
  if (departments.length) S.depts = departments;
}

async function syncCollection(collection) {
  if (LOCAL_MODE) return;
  const rows = rowsForCollection(collection).map((row) => ({ ...row, collection }));
  const keep = new Set(rows.map((row) => remoteRecordKey(collection, row.owner_id, row.record_id)));
  const changed = rows.filter((row) => remoteRecordSnapshots.get(remoteRecordKey(collection, row.owner_id, row.record_id))?.snapshot !== stableJSON(row.payload));
  if (changed.length) {
    const { data, error } = await backend.from('app_records').upsert(changed, { onConflict: 'collection,record_id,owner_scope' })
      .select('id,collection,record_id,owner_id,payload');
    if (error) throw error;
    (data || []).forEach((row) => remoteRecordSnapshots.set(remoteRecordKey(row.collection, row.owner_id, row.record_id), { ...row, snapshot: stableJSON(row.payload) }));
  }
  const stale = [...remoteRecordSnapshots.entries()].filter(([key, row]) => row.collection === collection
    && (isStaff() || row.owner_id === sessionAuthId) && !keep.has(key));
  const staleIds = stale.map(([, row]) => row.id);
  if (staleIds.length) {
    const { error } = await backend.from('app_records').delete().in('id', staleIds);
    if (error) throw error;
    stale.forEach(([key]) => remoteRecordSnapshots.delete(key));
  }
}

async function syncRemoteState() {
  if (!remoteReady || !sessionAuthId) return;
  await syncProfiles();
  if (isStaff()) {
    for (const collection of ['settings', 'departments', ...sharedCollections]) await syncCollection(collection);
  }
  for (const collection of privateCollections) await syncCollection(collection);
}

async function syncProfiles() {
  const staff = isStaff();
  for (const profile of S.users) {
    if (!profile.authId) continue;
    if (!staff && profile.authId !== sessionAuthId) continue;
    const snapshot = profileSnapshot(profile, staff);
    const previous = profileSnapshots.get(profile.authId);
    if (previous === snapshot) continue;
    const patch = {
      name: profile.name, dept: profile.dept || '', job_title: profile.jobTitle || '', theme: profile.theme || 'auto',
      points: Number(profile.points) || 0, xp: Number(profile.xp) || 0, badges: profile.badges || [],
      streak: Number(profile.streak) || 0, last_checkin: profile.lastCheckin || null
    };
    if (staff) Object.assign(patch, { role: profile.role, active: profile.active, pending: profile.pending });
    const { error } = await backend.from('profiles').update(patch).eq('id', profile.authId);
    if (error) throw error;
    profileSnapshots.set(profile.authId, snapshot);
  }
}

let backendInitPromise = null;
function initializeBackend() {
  if (backendInitPromise) return backendInitPromise;
  backendInitPromise = (async () => {
    if (LOCAL_MODE) {
      const defaults = DEFAULTS();
      const savedState = localStorage.getItem(LOCAL_STATE_KEY);
      const savedPasswords = localStorage.getItem(LOCAL_PASSWORDS_KEY);
      if (savedState) {
        const parsed = JSON.parse(savedState);
        S = { ...defaults, ...parsed, settings: { ...defaults.settings, ...parsed.settings } };
      } else {
        S = defaults;
      }
      localPasswords = savedPasswords ? JSON.parse(savedPasswords) : {};
      for (const [authId, password] of Object.entries(localPasswords)) {
        if (typeof password !== 'string') throw new Error('Os dados locais de senha estão inválidos.');
        if (!/^[0-9a-f]{32}:[0-9a-f]{64}$/i.test(password)) localPasswords[authId] = await hashLocalPassword(password);
      }
      let admin = S.users.find((u) => u.email === 'admin@local.test');
      if (!admin) {
        admin = { id: nid(), authId: 'local-admin', name: 'Administrador de demonstração', email: 'admin@local.test', role: 'admin',
          dept: '', jobTitle: '', active: true, pending: false, points: 0, xp: 0, badges: [], theme: 'auto',
          createdAt: Date.now(), lastLogin: null, streak: 0, lastCheckin: null, fails: 0, lockUntil: 0, mustChange: false };
        S.users.push(admin);
      }
      admin.authId ||= 'local-admin';
      if (!localPasswords[admin.authId]) localPasswords[admin.authId] = await hashLocalPassword('admin123');
      localStorage.setItem(LOCAL_PASSWORDS_KEY, JSON.stringify(localPasswords));
      const savedSession = Number(localStorage.getItem(LOCAL_SESSION_KEY));
      const savedUser = S.users.find((u) => u.id === savedSession && u.active && !u.pending);
      if (savedUser) {
        sessionId = savedUser.id;
        sessionAuthId = savedUser.authId;
      }
      remoteReady = false;
      backendReady = true;
      return;
    }
    if (!backend) throw new Error('O cliente Supabase não está disponível.');
    const { data, error } = await backend.auth.getSession();
    if (error) throw error;
    if (data.session?.user) { const loaded = await loadRemoteState(data.session.user); if (!loaded) await loadPublicConfig(); }
    else { sessionId = null; sessionAuthId = null; remoteReady = false; await loadPublicConfig(); }
    backendReady = true;
    backend.auth.onAuthStateChange((event) => {
      if (event === 'SIGNED_OUT') {
        S = DEFAULTS(); sessionId = null; sessionAuthId = null; remoteReady = false;
        if (backendReady) { renderChrome(); route(); }
      }
    });
  })().catch((error) => { backendInitPromise = null; throw error; });
  return backendInitPromise;
}

// Download de arquivos gerados pelo navegador (CSV e backup).
function downloadBlob(name, blob) {

// CSV com ';' e acentos corretos para abrir direto no Excel brasileiro.
function downloadCSV(name, rows) {

}
// Reduz imagem de produto para caber no armazenamento (240px, JPEG).
function imageToDataURL(file, max = 240) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const r = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(img.src); res(c.toDataURL('image/jpeg', 0.8));
    };
    img.onerror = () => rej(new Error('Imagem inválida.')); img.src = URL.createObjectURL(file);
  });
}
// Descobre a duração (em minutos) de um vídeo enviado.
function probeDuration(file) {
  return new Promise((res) => {
    const v = document.createElement('video'), url = URL.createObjectURL(file); let done = false;
    const end = (m) => { if (done) return; done = true; URL.revokeObjectURL(url); res(m); };
    v.preload = 'metadata'; v.onloadedmetadata = () => end(Math.max(1, Math.round(v.duration / 60))); v.onerror = () => end(0);
    setTimeout(() => end(0), 4000); v.src = url;
  });
}

// Trechos de vídeo já assistidos: junta intervalos [início, fim] em segundos.
function addRange(r, a, b) {
  if (b <= a) return; r.push([a, b]); r.sort((x, y) => x[0] - y[0]);
  const m = [r[0].slice()];
  for (const x of r.slice(1)) { const l = m[m.length - 1]; if (x[0] <= l[1]) l[1] = Math.max(l[1], x[1]); else m.push(x.slice()); }
  r.length = 0; m.forEach((x) => r.push(x));
}

// Apaga um curso, aulas, arquivos, prova e tudo ligado a ele.
async function purgeCourse(cid) {
  const c = course(cid); const ids = lessonsOf(cid).map((l) => l.id);
  for (const l of lessonsOf(cid)) if (l.fileId) await idbDel(l.fileId);

  for (const m of c.materials || []) await idbDel(m.fileId);
  const materialPaths = (c.materials || []).map((m) => m.filePath).filter(Boolean);
  if (!LOCAL_MODE && materialPaths.length) { const { error } = await backend.storage.from('course-materials').remove(materialPaths); if (error) throw error; }
  S.lessons = S.lessons.filter((l) => l.courseId !== cid); S.quizzes = S.quizzes.filter((q) => q.courseId !== cid);
  ['enrollments', 'attempts', 'certificates', 'ratings', 'comments', 'favorites'].forEach((k) => (S[k] = S[k].filter((r) => r.courseId !== cid)));
  S.progress = S.progress.filter((p) => !ids.includes(p.lessonId));
  Object.keys(S.watch).forEach((k) => ids.includes(Number(k.split(':')[1])) && delete S.watch[k]);

}

// Pontos têm dois contadores: "points" é o saldo (gasto na loja) e "xp" é o total já ganho (define nível e ranking).
function levelInfo(xp) {
  const step = S.settings.levelStep || 100, level = Math.floor(Math.sqrt(xp / step)) + 1;
  const cur = (level - 1) ** 2 * step, next = level ** 2 * step;
  return { level, cur, next, pct: Math.round(((xp - cur) / (next - cur)) * 100), title: LEVEL_TITLES[Math.min(level - 1, LEVEL_TITLES.length - 1)] };
}
// Soma ou subtrai pontos, registra o motivo e avisa quando sobe de nível.
function award(uid, amt, reason) {
  const u = user(uid); if (!u || !amt) return;
  const before = levelInfo(u.xp).level; u.points += amt; if (amt > 0) u.xp += amt;
  S.log.push({ userId: uid, delta: amt, reason, at: Date.now() });
  if (amt > 0 && levelInfo(u.xp).level > before) notify(uid, `⭐ Você subiu para o nível ${levelInfo(u.xp).level}!`, '#/profile');
}

// Confere se o usuário ganhou novas conquistas.
function checkBadges(uid) {
  const u = user(uid); if (!u) return; const st = userStats(u);
  BADGES.forEach((b) => {

      u.badges.push(b.id); notify(uid, `${b.icon} Nova conquista: ${b.name}!`, '#/profile'); award(uid, b.bonus || 0, `Conquista: ${b.name}`);

// Progresso do usuário em um curso. "complete" exige todas as aulas e a prova (se houver).
function courseProg(uid, cid) {
  const ls = lessonsOf(cid), done = ls.filter((l) => isDone(uid, l.id)).length, q = quizOf(cid);
  const quizOk = !q || S.attempts.some((a) => a.userId === uid && a.courseId === cid && a.passed);
  return { total: ls.length, done, pct: ls.length ? Math.round((done / ls.length) * 100) : 0, quizOk, complete: ls.length > 0 && done === ls.length && quizOk };
}
// Emite o certificado e dá o bônus quando o curso é concluído (só uma vez).
function checkCourseCompletion(uid, cid) {
  if (!courseProg(uid, cid).complete || certOf(uid, cid)) return null;
  const c = course(cid), cert = { code: genCode(10), userId: uid, courseId: cid, at: Date.now() };
  S.certificates.push(cert);
  if (c.bonus > 0) award(uid, c.bonus, `Curso concluído: ${c.title}`);
  notify(uid, `🎓 Você concluiu "${c.title}" e ganhou um certificado!`, `#/certificate/${cert.code}`);
  checkBadges(uid); return cert;
}
// Conclui uma aula: pontos só na primeira vez. Depois confere o curso e as conquistas.
function completeLesson(uid, lid) {
  if (isDone(uid, lid)) return null;
  const l = lesson(lid), pts = Number(l.points) || 0;
  S.progress.push({ userId: uid, lessonId: lid, at: Date.now() });
  if (pts > 0) award(uid, pts, `Aula concluída: ${l.title}`);
  const cert = checkCourseCompletion(uid, l.courseId); checkBadges(uid); save();
  return { earned: pts, cert };
}
// Check-in diário: dá pontos e conta dias seguidos. A cada 7 dias seguidos, bônus extra.
function checkin(uid) {
  const u = user(uid), t = todayISO(); if (u.lastCheckin === t) return null;
  const yesterday = isoOf(new Date(Date.now() - 864e5));
  u.streak = u.lastCheckin === yesterday ? (u.streak || 0) + 1 : 1; u.lastCheckin = t;
  let total = S.settings.dailyBonus;

  if (u.streak % 7 === 0) { award(uid, S.settings.streak7Bonus, 'Bônus de 7 dias seguidos'); total += S.settings.streak7Bonus; }
  checkBadges(uid); save(); return total;
}

// Lê o formato interno e variações comuns copiadas de provas com títulos e numeração.
function parseQuiz(text) {
  const qs = []; let cur = null;
  const lines = text.replace(/\r\n?/g, '\n').split('\n');
  lines.forEach((raw) => {
    const markdownHeading = /^#{1,6}\s*/.test(raw.trim());
    let line = raw.trim().replace(/^>\s*/, '').replace(/^#{1,6}\s*/, '').trim();
    if (!line) return;

    if (/^(?:prova|questionário|avaliação(?:\s+final)?)(?:\s*[:—-].*)?$/i.test(line)) return;

    const question = line.match(/^(?:P|Pergunta|Questão)\s*(?:\d+\s*)?[:.)-]\s*(.+)$/i)
      || line.match(/^\d+[.)-]\s+(.+)$/);
    if (question) {
      cur = { q: question[1].trim(), options: [], correct: -1, explain: '', answerLetter: '' };
      qs.push(cur); return;
    }
    if (markdownHeading) return;

    const explanation = line.match(/^(?:E|Explicação)\s*:\s*(.*)$/i);
    if (explanation && cur) { cur.explain = explanation[1].trim(); return; }

    const answer = line.match(/^(?:resposta correta|gabarito)\s*[:=-]\s*(?:alternativa\s*)?([a-e])\b/i);
    if (answer && cur) { cur.answerLetter = answer[1].toLowerCase(); return; }

    if (!cur && !/^[a-e]\s*[).:-]/i.test(line)) return;

    let optionLine = line.replace(/^[-•]\s*/, '');
    const marked = optionLine.startsWith('*');
    if (marked) optionLine = optionLine.slice(1).trim();
    const option = optionLine.match(/^(?:\(([a-e])\)|([a-e])\s*[).:-])\s*(.*)$/i);
    if (option && cur) {
      let value = option[3].trim();
      let correct = marked || /^(?:\*|\[x\]\s*|✅\s*)/i.test(value);
      value = value.replace(/^(?:\*\s*|\[x\]\s*|✅\s*)/i, '').replace(/\s*\((?:correta|correto)\)\s*$/i, () => {
        correct = true; return '';
      }).trim();
      if (!value) fail(`Alternativa ${option[1] || option[2]} está vazia.`);
      if (correct && cur.correct >= 0) fail('Marque apenas uma alternativa correta por pergunta.');
      cur.options.push(value);
      if (correct) cur.correct = cur.options.length - 1;
      return;
    }

    fail(`Linha não reconhecida: "${raw.trim()}"`);
  });
  qs.forEach((q) => {
    if (q.correct < 0 && q.answerLetter) q.correct = q.answerLetter.charCodeAt(0) - 97;
    delete q.answerLetter;
  });
  qs.forEach((q, i) => {
    if (!q.q) fail(`Pergunta ${i + 1} está vazia.`);
    if (q.options.length < 2) fail(`Pergunta ${i + 1}: use pelo menos 2 alternativas.`);
    if (q.correct < 0 || q.correct >= q.options.length) fail(`Pergunta ${i + 1}: marque a correta com * ou informe "Resposta correta: B".`);
  });
  if (!qs.length) fail('Adicione ao menos uma pergunta.');
  return qs;
}
const quizToText = (qs) => qs.map((q) => `P: ${q.q}\n${q.options.map((o, i) => `${'abcde'[i]}) ${i === q.correct ? '*' : ''}${o}`).join('\n')}${q.explain ? `\nE: ${q.explain}` : ''}`).join('\n\n');

// ROTEADOR: lê o endereço (#/courses, #/store...) e decide qual tela mostrar.
async function route(scroll = true) {
  stopMedia();
  const [, page, a, b] = (location.hash || '#/home').split('/');
  try {
    if (!backendReady) await initializeBackend();
    if (new URLSearchParams(location.search).get('recovery') === '1') { renderChrome(); VIEWS.resetPassword(); return; }
    if (page === 'verify') { renderChrome(); await viewVerify(a); return; } // verificação pública de certificado
    const u = me(); renderChrome();
    if (!u) { page === 'register' ? viewRegister() : viewLogin(); return; }
    if (u.mustChange && page !== 'account') { go('#/account'); return; } // troca de senha obrigatória
    if (scroll) closeModal();
    await (VIEWS[page] || VIEWS.home)(a, b);
  } catch (e) {
    app.innerHTML = `<div class="panel empty"><h2>Não foi possível abrir</h2><p>${esc(e.message)}</p><a class="btn" href="#/home">Voltar ao início</a></div>`;
  }
  renderChrome(); if (scroll) window.scrollTo(0, 0);
}

const fsel = (label, key, opts, val) => `<label>${label}<select data-filter="${key}">${opts.map(([v, t]) => `<option value="${esc(v)}" ${v === val ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select></label>`;
const ICON = { video: '▶', link: '🔗', texto: '📄' };
const ytId = (url) => ((url || '').match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{11})/) || [])[1] || '';

// ---------- INÍCIO ----------
VIEWS.home = async () => {

  const mine = S.enrollments.filter((e) => e.userId === u.id).map((e) => ({ e, c: course(e.courseId), p: courseProg(u.id, e.courseId) })).filter((x) => x.c);
  const pend = mine.filter((x) => !x.p.complete);
  const duty = pend.filter((x) => x.c.mandatory).sort((a, b) => (dueOf(a.e, a.c) || '9').localeCompare(dueOf(b.e, b.c) || '9'));
  const cont = pend.find((x) => x.p.done > 0) || pend[0];
  const recs = visibleCourses(u).filter((c) => !isEnrolled(u.id, c.id) && c.status === 'publicado').slice(0, 3);
  const news = S.announcements.slice().sort((a, b) => (b.pinned - a.pinned) || b.at - a.at).slice(0, 3);

      <div class="actions"><button class="btn gold" data-action="checkin" ${checked ? 'disabled' : ''}>${checked ? 'Check-in feito hoje ✓' : `Check-in diário (+${S.settings.dailyBonus} pts)`}</button><a class="btn ghost" style="color:#fff;border-color:#fff" href="#/store">Ir à loja</a></div></div>
    <div class="grid sm" style="margin-bottom:20px">
      <div class="stat"><b>${u.points}</b><span>Pontos disponíveis</span></div><div class="stat"><b>${pend.length}</b><span>Cursos em andamento</span></div>
      <div class="stat"><b>${st.courses}</b><span>Cursos concluídos</span></div><div class="stat"><b>${st.lessons}</b><span>Aulas concluídas</span></div>
      <div class="stat"><b>${u.badges.length}/${BADGES.length}</b><span>Conquistas</span></div></div>
    ${isAdmin() && !S.courses.length ? panel('<h2>Plataforma vazia</h2><p class="muted">Quer ver tudo funcionando? Carregue cursos, produtos e alunos de exemplo (você pode apagar depois).</p><button class="btn" data-action="seed">Carregar dados de demonstração</button>') : ''}
    ${duty.length ? panel(`<h2>⚠ Obrigatórios pendentes</h2>${duty.map((x) => `<div class="spread" style="padding:8px 0;border-bottom:1px solid var(--line)"><div><a href="#/course/${x.c.id}"><strong>${esc(x.c.title)}</strong></a><div class="muted small">${x.p.done}/${x.p.total} aulas${x.p.quizOk ? '' : ' · prova pendente'}</div></div>${dueTag(dueOf(x.e, x.c))}</div>`).join('')}`) : ''}
    ${cont ? panel(`<h2>Continuar estudando</h2><div class="spread"><div><strong>${esc(cont.c.title)}</strong><div class="bar" style="width:260px;margin-top:6px"><span style="width:${cont.p.pct}%"></span></div><div class="muted small">${cont.p.pct}% concluído</div></div><a class="btn" href="#/course/${cont.c.id}">Continuar</a></div>`) : ''}
    ${news.length ? panel(`<h2>📢 Mural de avisos</h2>${news.map((n) => `<div style="padding:8px 0;border-bottom:1px solid var(--line)"><strong>${n.pinned ? '📌 ' : ''}${esc(n.title)}</strong> <span class="muted small">${fmtDate(n.at)}</span><div>${esc(n.text)}</div></div>`).join('')}`) : ''}
    ${recs.length ? `<h2>Recomendados para você</h2><div class="grid" style="margin-bottom:20px">${recs.map((c) => courseCard(c, u)).join('')}</div>` : ''}
    <h2>Conquistas</h2><div class="badges">${BADGES.map((b) => `<div class="badge ${u.badges.includes(b.id) ? '' : 'locked'}"><div class="ic">${b.icon}</div><strong>${b.name}</strong><div class="muted small">${b.desc}</div></div>`).join('')}</div>`;
};
ACTIONS.checkin = () => { const t = checkin(me().id); if (t) toast(`Check-in feito! +${t} pontos`); renderChrome(); rerender(); };
ACTIONS.seed = async () => { need('admin'); await seedDemo(); toast('Cursos, aulas e produtos de demonstração carregados.'); rerender(); };

// ---------- CATÁLOGO DE CURSOS ("Cursos" e "Meus cursos") ----------
let catalogMode = 'all';
VIEWS.courses = () => { catalogMode = 'all'; viewCatalog(); };
VIEWS.mine = () => { catalogMode = 'mine'; viewCatalog(); };
// Aplica busca, filtros e ordenação.
function filterCourses(u) {
  const f = FILTERS.C; let L = visibleCourses(u);
  if (catalogMode === 'mine') L = L.filter((c) => isEnrolled(u.id, c.id));
  const q = f.q.toLowerCase().trim(); if (q) L = L.filter((c) => `${c.title} ${c.description} ${c.area} ${c.instructor}`.toLowerCase().includes(q));
  if (f.cat) L = L.filter((c) => c.category === f.cat); if (f.area) L = L.filter((c) => c.area === f.area); if (f.level) L = L.filter((c) => c.level === f.level);
  const st = { inscritos: (c) => isEnrolled(u.id, c.id), nao: (c) => !isEnrolled(u.id, c.id), andamento: (c) => isEnrolled(u.id, c.id) && !courseProg(u.id, c.id).complete && courseProg(u.id, c.id).done > 0,
    concluidos: (c) => courseProg(u.id, c.id).complete, obrigatorios: (c) => c.mandatory, favoritos: (c) => isFav(u.id, c.id) }[f.status];
  if (st) L = L.filter(st);
  const by = { recent: (a, b) => b.createdAt - a.createdAt, title: (a, b) => a.title.localeCompare(b.title), popular: (a, b) => S.enrollments.filter((e) => e.courseId === b.id).length - S.enrollments.filter((e) => e.courseId === a.id).length, rating: (a, b) => avgRating(b.id).avg - avgRating(a.id).avg }[f.sort];
  return L.sort(by);
}
const courseListHTML = () => { const u = me(), L = filterCourses(u); return L.length ? L.map((c) => courseCard(c, u)).join('') : `<div class="panel empty" style="grid-column:1/-1">${catalogMode === 'mine' ? 'Você ainda não está inscrito em nenhum curso (ou nenhum bate com o filtro).' : 'Nenhum curso encontrado.'}</div>`; };
REFRESH.C = () => { $('course-list').innerHTML = courseListHTML(); };
function viewCatalog() {
  const f = FILTERS.C, areas = [...new Set(S.courses.map((c) => c.area).filter(Boolean))].sort();
  app.innerHTML = `<div class="page-head"><h1>${catalogMode === 'mine' ? 'Meus cursos' : 'Cursos e padrões de serviço'}</h1>${isStaff() ? '<button class="btn" data-action="course-new">+ Novo curso</button>' : ''}</div>
    <div class="panel"><div class="row"><label>Buscar<input data-filter="C.q" value="${esc(f.q)}" placeholder="Título, área, instrutor..."></label>
      ${fsel('Tipo', 'C.cat', [['', 'Todos'], ['curso', 'Cursos'], ['padrao_servico', 'Padrões de serviço']], f.cat)}
      ${fsel('Área', 'C.area', [['', 'Todas'], ...areas.map((a) => [a, a])], f.area)}
      ${fsel('Nível', 'C.level', [['', 'Todos'], ...Object.entries(LEVELS)], f.level)}
      ${fsel('Situação', 'C.status', [['', 'Todas'], ['andamento', 'Em andamento'], ['concluidos', 'Concluídos'], ['obrigatorios', 'Obrigatórios'], ['favoritos', 'Favoritos'], ...(catalogMode === 'all' ? [['inscritos', 'Inscrito'], ['nao', 'Não inscrito']] : [])], f.status)}
      ${fsel('Ordenar', 'C.sort', [['recent', 'Mais recentes'], ['title', 'Título (A-Z)'], ['popular', 'Mais populares'], ['rating', 'Melhor avaliados']], f.sort)}</div></div>
    <div class="grid" id="course-list">${courseListHTML()}</div>`;
}
// Cartão de curso (clicável). O botão de favorito tem ação própria.
function courseCard(c, u) {
  const en = enrollment(u.id, c.id), p = courseProg(u.id, c.id), r = avgRating(c.id), fav = isFav(u.id, c.id);
  return `<div class="card course" data-action="go" data-href="#/course/${c.id}"><div class="cover" style="--h:${hue(c.id)}"><span>${esc(c.emoji || '📘')}</span>
    <button class="fav ${fav ? 'on' : ''}" data-action="fav" data-id="${c.id}" aria-label="Favoritar">${fav ? '★' : '☆'}</button></div>
    <div class="tags">${tag(CAT[c.category], c.category === 'padrao_servico' ? 'service' : '')}${c.mandatory ? tag('Obrigatório', 'bad') : ''}${c.status !== 'publicado' ? tag('Rascunho', 'warn') : ''}${p.complete ? tag('Concluído ✓', 'ok') : ''}</div>
    <h3><a href="#/course/${c.id}">${esc(c.title)}</a></h3><p class="muted clamp">${esc(c.description)}</p>
    <div class="muted small">${p.total} aula${p.total === 1 ? '' : 's'} · ${fmtDur(courseHours(c.id))}${r.n ? ` · ★ ${r.avg.toFixed(1)}` : ''}</div>
    ${en ? `<div class="bar"><span style="width:${p.pct}%"></span></div><div class="actions small muted">${p.pct}% concluído ${dueTag(dueOf(en, c), p.complete)}</div>` : '<div class="muted small">Não inscrito</div>'}</div>`;
}
ACTIONS.go = (d) => { location.hash = d.href; };
ACTIONS.fav = (d) => { const u = me(), id = Number(d.id); S.favorites = isFav(u.id, id) ? S.favorites.filter((f) => !(f.userId === u.id && f.courseId === id)) : [...S.favorites, { userId: u.id, courseId: id }]; save(); rerender(); };

// Biblioteca central: lista vídeos dos cursos acessíveis e abre a aula selecionada.
VIEWS.videos = () => {
  const u = me();
  const videos = S.lessons.filter((l) => ['video', 'link'].includes(l.type) && (isStaff() || isEnrolled(u.id, l.courseId)))
    .map((l) => ({ l, c: course(l.courseId) })).filter((x) => x.c)
    .sort((a, b) => a.c.title.localeCompare(b.c.title) || a.l.position - b.l.position);
  app.innerHTML = `<div class="page-head"><div><h1>Vídeos</h1><p class="muted">Aulas em vídeo disponíveis nos seus cursos.</p></div><span class="muted small">${videos.length} ${videos.length === 1 ? 'vídeo' : 'vídeos'}</span></div>
    ${videos.length ? `<div class="grid">${videos.map(({ l, c }) => {
      const w = S.watch[u.id + ':' + l.id], pct = w?.dur ? Math.min(100, Math.round((covered(w.ranges || []) / w.dur) * 100)) : 0;
      return `<article class="card"><div class="spread"><span class="tag">${l.type === 'video' ? 'Arquivo de vídeo' : 'Vídeo por link'}</span><span class="muted small">${l.duration ? fmtDur(l.duration) : 'Duração não informada'}</span></div>
        <h2>${esc(l.title)}</h2><p class="muted small">${esc(c.title)}${l.module ? ` · ${esc(l.module)}` : ''}</p>
        ${pct ? `<div class="bar" aria-label="${pct}% assistido"><span style="width:${pct}%"></span></div><span class="muted small">${pct}% assistido</span>` : ''}
        <button class="btn" data-action="watch-video" data-id="${l.id}">▶ ${w?.pos > 0 ? 'Continuar reprodução' : 'Reproduzir vídeo'}</button></article>`;
    }).join('')}</div>` : `<div class="panel empty"><h2>Nenhum vídeo disponível</h2><p>${isStaff() ? 'Adicione aulas do tipo vídeo ou link aos cursos para que apareçam aqui.' : 'Inscreva-se em um curso com aulas em vídeo para encontrá-las aqui.'}</p>${isStaff() && S.courses.length ? `<a class="btn" href="#/admin/courses">Gerenciar cursos</a>` : ''}</div>`}`;
};
ACTIONS['watch-video'] = (d) => {
  const l = lesson(d.id);
  if (!l || (!isStaff() && !isEnrolled(me().id, l.courseId))) fail('Este vídeo não está disponível para sua conta.');
  curCourse = l.courseId; courseTab = 'aulas'; curLesson = l.id; go('#/course/' + l.courseId);
};

// ---------- PÁGINA DO CURSO ----------
let courseTab = 'aulas', curLesson = null, curCourse = null; // aba aberta, aula tocando e curso atual
// Em cursos "sequenciais" a aula só abre depois de concluir a anterior.
const lockedLesson = (l, ls, u, c) => { const i = ls.findIndex((x) => x.id === l.id); return c.sequential && !isStaff() && i > 0 && !isDone(u.id, ls[i - 1].id); };

VIEWS.course = async (id) => {
  id = Number(id); const c = course(id); if (!c) fail('Curso não encontrado.');
  const u = me(), staff = isStaff();
  if (c.status !== 'publicado' && !staff && !isEnrolled(u.id, id)) fail('Este curso não está disponível.');
  if (curCourse !== id) { curCourse = id; courseTab = 'aulas'; curLesson = null; }
  const en = enrollment(u.id, id), canView = !!en || staff, ls = lessonsOf(id), p = courseProg(u.id, id), cert = certOf(u.id, id), q = quizOf(id), r = avgRating(id);
  const pre = c.prereq ? course(c.prereq) : null, preOk = !pre || staff || !!certOf(u.id, pre.id);
  // Escolhe a aula aberta: a primeira não concluída e liberada.
  if (!curLesson || !lesson(curLesson) || lesson(curLesson).courseId !== id || lockedLesson(lesson(curLesson), ls, u, c)) curLesson = (ls.find((l) => !isDone(u.id, l.id) && !lockedLesson(l, ls, u, c)) || ls[0] || {}).id || null;
  const mine = S.ratings.find((x) => x.userId === u.id && x.courseId === id)?.stars || 0;
  const tabs = [['aulas', 'Aulas'], ['sobre', 'Sobre e materiais'], ['discussao', `Discussão (${S.comments.filter((x) => x.courseId === id).length})`], ...(q ? [['prova', 'Prova']] : [])];
  const body = courseTab === 'sobre' ? tabSobre(c, canView) : courseTab === 'discussao' ? tabDiscussao(c, u, canView) : courseTab === 'prova' && q ? tabProva(c, u, canView, p) : tabAulas(c, ls, u, canView, preOk, pre);
  app.innerHTML = `<div class="panel"><div class="spread" style="align-items:flex-start"><div style="flex:1 1 380px">
      <div class="tags">${tag(CAT[c.category], c.category === 'padrao_servico' ? 'service' : '')}${c.mandatory ? tag('Obrigatório', 'bad') : ''}${c.sequential ? tag('Aulas em sequência') : ''}${c.status !== 'publicado' ? tag('Rascunho', 'warn') : ''}${tag(LEVELS[c.level] || '')}</div>
      <h1 style="margin-top:8px">${esc(c.emoji || '')} ${esc(c.title)}</h1><p class="muted">${esc(c.description)}</p>
      <div class="muted small">👤 ${esc(c.instructor || '—')} · 🏷 ${esc(c.area || 'Geral')} · ⏱ ${fmtDur(courseHours(id))} · 👥 ${S.enrollments.filter((e) => e.courseId === id).length} inscritos · 🎯 +${c.bonus} pontos ao concluir</div>
      <div class="stars" style="margin-top:6px">${r.n ? `<strong>★ ${r.avg.toFixed(1)}</strong> <span class="muted small">(${r.n})</span> ` : '<span class="muted small">Sem avaliações </span>'}${en ? [1, 2, 3, 4, 5].map((n) => `<button class="${n <= mine ? 'on' : ''}" data-action="rate" data-id="${id}" data-stars="${n}" aria-label="${n} estrelas">★</button>`).join('') : ''}</div></div>
      <div class="actions">${!en && !staff ? `<button class="btn" data-action="enroll" data-id="${id}" ${preOk ? '' : 'disabled'}>Inscrever-me</button>` : ''}${en && !staff ? `<button class="btn ghost small" data-action="unenroll" data-id="${id}">Cancelar inscrição</button>` : ''}
        <button class="btn ghost small" data-action="fav" data-id="${id}">${isFav(u.id, id) ? '★ Favorito' : '☆ Favoritar'}</button>
        ${staff ? `<button class="btn ghost small" data-action="course-edit" data-id="${id}">Editar curso</button><button class="btn ghost small" data-action="quiz-edit" data-id="${id}">${q ? 'Editar prova' : 'Criar prova'}</button><button class="btn ghost small" data-action="assign-open" data-id="${id}">Atribuir</button><button class="btn ghost small" data-action="course-publish" data-id="${id}">${c.status === 'publicado' ? 'Despublicar' : 'Publicar'}</button>` : ''}</div></div>
      ${pre && !preOk ? `<div class="notice" style="margin-top:12px">Pré-requisito: conclua primeiro <a href="#/course/${pre.id}">${esc(pre.title)}</a>.</div>` : ''}
      ${en ? `<div style="margin-top:14px"><div class="bar"><span id="prog-bar" style="width:${p.pct}%"></span></div><div class="actions small muted" style="margin-top:4px"><span id="prog-text">${p.done}/${p.total} aulas · ${p.pct}%</span>${q ? (p.quizOk ? tag('Prova aprovada ✓', 'ok') : tag('Prova pendente', 'warn')) : ''}${dueTag(dueOf(en, c), p.complete)}${cert ? `<a class="btn gold small" href="#/certificate/${cert.code}">🎓 Ver certificado</a>` : ''}</div></div>` : ''}</div>
    <div class="tabs">${tabs.map(([k, l]) => `<button class="${courseTab === k ? 'on' : ''}" data-action="ctab" data-tab="${k}">${l}</button>`).join('')}</div>${body}`;
  if (courseTab === 'aulas') await setupMedia();
};
ACTIONS.ctab = (d) => { courseTab = d.tab; rerender(); };
ACTIONS.enroll = async (d) => {
  const u = me(), c = course(d.id), pre = c.prereq ? course(c.prereq) : null;
  if (pre && !isStaff() && !certOf(u.id, pre.id)) fail(`Conclua antes: ${pre.title}`);
  const added = !isEnrolled(u.id, c.id);
  if (added) S.enrollments.push({ userId: u.id, courseId: c.id, at: Date.now(), dueDate: '' });
  if (added && !LOCAL_MODE) {
    try { await syncCollection('enrollments'); }
    catch (error) { S.enrollments = S.enrollments.filter((e) => !(e.userId === u.id && e.courseId === c.id)); throw error; }
    const { data, error } = await backend.from('app_records').select('payload').eq('collection', 'quizzes').eq('record_id', String(c.id)).is('owner_id', null).maybeSingle();
    if (error) fail(error.message); if (data && !quizOf(c.id)) S.quizzes.push(data.payload);
  }
  audit(`Inscrição: ${c.title}`); save(); toast('Inscrição feita!'); rerender();
};
ACTIONS.unenroll = (d) => { if (!confirm('Cancelar sua inscrição? Seu progresso é mantido.')) return; const u = me(); S.enrollments = S.enrollments.filter((e) => !(e.userId === u.id && e.courseId === Number(d.id))); save(); rerender(); };
ACTIONS.rate = (d) => { const u = me(), id = Number(d.id); S.ratings = S.ratings.filter((x) => !(x.userId === u.id && x.courseId === id)); S.ratings.push({ userId: u.id, courseId: id, stars: Number(d.stars) }); save(); toast('Obrigado pela avaliação!'); rerender(); };

// Aba AULAS: player (ou texto) à esquerda e lista de aulas por módulo à direita.
function tabAulas(c, ls, u, canView, preOk, pre) {
  const staff = isStaff();
  if (!ls.length) return panel('<div class="empty">Este curso ainda não tem aulas.</div>' + (staff ? `<div style="text-align:center"><button class="btn" data-action="lesson-new" data-id="${c.id}">+ Adicionar aula</button></div>` : ''));
  let lastMod = null;
  const items = ls.map((x) => {
    let h = ''; const mod = x.module || ''; if (mod !== lastMod) { h = `<li class="mod">${esc(mod || 'Aulas')}</li>`; lastMod = mod; }
    const lk = lockedLesson(x, ls, u, c), dn = isDone(u.id, x.id);
    return h + `<li class="l ${dn ? 'done' : ''} ${x.id === curLesson ? 'active' : ''} ${lk ? 'locked' : ''}" data-action="lesson" data-id="${x.id}"><span class="check">${dn ? '✓' : lk ? '🔒' : ''}</span>
      <span>${ICON[x.type] || ''} ${esc(x.title)}</span><span class="pts">${x.duration ? x.duration + ' min · ' : ''}+${x.points}</span>
      ${staff ? `<button class="btn ghost small" data-action="lesson-up" data-id="${x.id}" aria-label="Subir">↑</button><button class="btn ghost small" data-action="lesson-down" data-id="${x.id}" aria-label="Descer">↓</button><button class="btn ghost small" data-action="lesson-edit" data-id="${x.id}" aria-label="Editar">✎</button><button class="btn danger small" data-action="lesson-del" data-id="${x.id}" aria-label="Excluir">✕</button>` : ''}</li>`;
  }).join('');
  const main = canView ? lessonView(c, ls, lesson(curLesson), u) : panel(`<div class="empty"><p>Inscreva-se para assistir às aulas e ganhar pontos.</p><button class="btn" data-action="enroll" data-id="${c.id}" ${preOk ? '' : 'disabled'}>Inscrever-me</button></div>`);
  return `<div class="course-layout"><div>${main}</div><aside class="panel"><div class="spread"><h3>Aulas (${ls.length})</h3>${staff ? `<button class="btn small" data-action="lesson-new" data-id="${c.id}">+ Aula</button>` : ''}</div><ul class="lessons">${items}</ul></aside></div>`;
}
// Conteúdo da aula aberta: vídeo, YouTube ou texto, botões e anotações.
function lessonView(c, ls, l, u) {
  const dn = isDone(u.id, l.id), next = ls[ls.findIndex((x) => x.id === l.id) + 1], yt = l.type === 'link' ? ytId(l.url) : '';
  const tracked = l.type === 'video' || (l.type === 'link' && !yt); // só vídeos próprios/diretos têm controle de quanto foi assistido
  const media = l.type === 'texto' ? `<article class="panel prose">${renderText(l.content || '')}</article>`
    : yt ? `<iframe class="player" src="https://www.youtube-nocookie.com/embed/${yt}" allowfullscreen title="${esc(l.title)}"></iframe>`
    : `<video id="player" class="player" controls controlsList="nodownload" preload="metadata" data-lesson="${l.id}"></video>`;
  return media + `<div class="panel" style="margin-top:16px"><div class="spread"><div><h2>${esc(l.title)}</h2><div class="muted small">${esc(l.module || '')} · +${l.points} pontos</div></div>
    <div class="actions" id="lesson-actions">${dn ? tag('Concluída ✓', 'ok') : tracked && !isStaff() ? `<span class="muted small">Conclui sozinha ao assistir ${S.settings.minWatchPct}%</span>` : `<button class="btn" data-action="complete" data-id="${l.id}">Marcar como concluída</button>`}
      ${next ? `<button class="btn ghost" data-action="lesson-next" data-id="${next.id}">Próxima aula →</button>` : ''}</div></div>
    ${tracked ? '<label class="small">Velocidade <select data-speed style="width:auto;display:inline-block"><option>0.75</option><option selected>1</option><option>1.25</option><option>1.5</option><option>2</option></select></label>' : ''}
    <label>Minhas anotações (salvas automaticamente)<textarea data-note="${l.id}" placeholder="Escreva aqui...">${esc(S.notes[u.id + ':' + l.id] || '')}</textarea></label></div>`;
}
// Liga o vídeo: carrega o arquivo, retoma de onde parou e controla o quanto foi assistido (anti-pulo).
async function setupMedia() {
  const v = $('player'); if (!v) return;
  const lid = Number(v.dataset.lesson), l = lesson(lid), u = me();
  if (l.type === 'video') {
    if (l.filePath && !LOCAL_MODE) {
      const { data, error } = await backend.storage.from('course-videos').createSignedUrl(l.filePath, 3600);
      if (error) { toast(error.message, true); return; } mediaUrl = data.signedUrl; v.src = mediaUrl;
    } else {
      const blob = l.fileId ? await idbGet(l.fileId) : null;
      if (!blob) { toast('Arquivo de vídeo não encontrado neste navegador.', true); return; }
      mediaUrl = URL.createObjectURL(blob); v.src = mediaUrl;
    }
  }
  else v.src = l.url;
  const key = u.id + ':' + lid, w = S.watch[key] || (S.watch[key] = { pos: 0, ranges: [], dur: 0 });
  let last = 0, lastSave = 0;
  const enough = () => w.dur && (covered(w.ranges) / w.dur) * 100 >= S.settings.minWatchPct;
  v.addEventListener('loadedmetadata', () => { w.dur = v.duration; if (w.pos > 3 && w.pos < v.duration - 5) v.currentTime = w.pos; last = v.currentTime; });
  v.addEventListener('seeking', () => { last = v.currentTime; });
  v.addEventListener('timeupdate', () => {
    const t = v.currentTime; if (!v.seeking && t >= last && t - last < 2) addRange(w.ranges, Math.floor(last), Math.ceil(t));
    last = t; w.pos = t; w.dur = v.duration || w.dur;
    if (Date.now() - lastSave > 5000) { save(); lastSave = Date.now(); }
    if (!isDone(u.id, lid) && enough()) finishLesson(lid);
  });
  v.addEventListener('pause', save);
  v.addEventListener('ended', () => { save(); if (!isDone(u.id, lid) && !enough()) toast(`Assista pelo menos ${S.settings.minWatchPct}% da aula (sem pular trechos) para concluir.`, true); });
  v.addEventListener('ratechange', () => {});
}
// Conclui a aula e atualiza a tela sem interromper o vídeo.
function finishLesson(lid) {
  const u = me(), r = completeLesson(u.id, lid); if (!r) return;
  toast(r.earned ? `Aula concluída! +${r.earned} pontos` : 'Aula concluída!'); if (r.cert) setTimeout(() => toast('🎓 Curso concluído! Seu certificado foi emitido.'), 2600);
  const li = document.querySelector(`.lessons li[data-id="${lid}"]`); if (li) { li.classList.add('done'); li.querySelector('.check').textContent = '✓'; }
  const p = courseProg(u.id, lesson(lid).courseId); if ($('prog-bar')) { $('prog-bar').style.width = p.pct + '%'; $('prog-text').textContent = `${p.done}/${p.total} aulas · ${p.pct}%`; }
  const a = $('lesson-actions'); if (a && !a.querySelector('.tag')) a.insertAdjacentHTML('afterbegin', tag('Concluída ✓', 'ok'));
  renderChrome();
}

// Estorno: devolve os pontos gastos SEM aumentar o XP (nível e ranking não mudam).

// Cancela um pedido: devolve pontos e estoque.
function cancelRedemption(r, note) {
  if (['entregue', 'cancelado'].includes(r.status)) fail('Este pedido não pode ser cancelado.');
  r.status = 'cancelado'; r.note = note || ''; refund(r.userId, r.cost, `Estorno: ${r.productName}`);
  const p = product(r.productId); if (p && !p.unlimited) p.stock++;
  notify(r.userId, `Sua troca "${r.productName}" foi cancelada e os pontos foram devolvidos.`, '#/store');
}
// TROCAR PONTOS POR PRODUTO: confere estoque, saldo e limite; desconta pontos; cria o pedido com código.
// Para mudar as regras da loja, edite esta ação.
ACTIONS.redeem = (d) => {
  const u = me(), p = product(d.id); if (!p || !p.active) fail('Produto indisponível.');
  if (!p.unlimited && p.stock <= 0) fail('Produto sem estoque.'); if (u.points < p.cost) fail('Pontos insuficientes.');
  const got = S.redemptions.filter((r) => r.userId === u.id && r.productId === p.id && r.status !== 'cancelado').length; if (p.limit && got >= p.limit) fail('Você atingiu o limite deste produto.');
  if (!confirm(`Trocar ${p.cost} pontos por "${p.name}"?`)) return;
  if (!p.unlimited) p.stock--; award(u.id, -p.cost, `Troca: ${p.name}`);
  const r = { id: nid(), userId: u.id, productId: p.id, productName: p.name, cost: p.cost, status: 'pendente', code: genCode(8), at: Date.now(), note: '' }; S.redemptions.push(r);
  S.users.filter((x) => x.role === 'admin').forEach((a) => notify(a.id, `🎁 Nova troca: ${p.name} (${u.name})`, '#/admin/redemptions'));
  checkBadges(u.id); audit(`Troca: ${p.name}`); save(); toast(`Troca realizada! Código: ${r.code}`); renderChrome(); rerender();
};
ACTIONS['redeem-cancel-mine'] = (d) => { const r = S.redemptions.find((x) => x.id === Number(d.id) && x.userId === me().id); if (!r || r.status !== 'pendente') fail('Só dá para cancelar pedidos pendentes.'); if (!confirm('Cancelar esta troca e receber os pontos de volta?')) return; cancelRedemption(r, 'Cancelado pelo usuário'); save(); renderChrome(); rerender(); };

AT.dashboard = () => {
  const today = todayISO(), active30 = S.users.filter((u) => u.lastLogin && Date.now() - u.lastLogin < 30 * 864e5).length;
  const overdue = S.enrollments.filter((e) => { const c = course(e.courseId), d = c && dueOf(e, c); return d && d < today && !courseProg(e.userId, e.courseId).complete; }).length;
  const given = S.log.filter((l) => l.delta > 0).reduce((s, l) => s + l.delta, 0), pendRed = S.redemptions.filter((r) => r.status === 'pendente').length;
  const rate = S.enrollments.length ? Math.round((S.certificates.length / S.enrollments.length) * 100) : 0;
  const days = [...Array(14)].map((_, i) => { const iso = isoOf(new Date(Date.now() - (13 - i) * 864e5)); return { label: iso.slice(8), value: S.progress.filter((p) => isoOf(new Date(p.at)) === iso).length }; });
  const bars = S.courses.map((c) => { const e = S.enrollments.filter((x) => x.courseId === c.id).length, k = S.certificates.filter((x) => x.courseId === c.id).length; return { c, e, k, pct: e ? Math.round((k / e) * 100) : 0 }; }).sort((a, b) => b.e - a.e).slice(0, 8);
  const top = S.users.filter((u) => u.role === 'aluno').sort((a, b) => b.xp - a.xp).slice(0, 5);
  return `<div class="grid sm" style="margin-bottom:20px">
      <div class="stat"><b>${S.users.length}</b><span>Usuários (${active30} ativos em 30 dias)</span></div><div class="stat"><b>${S.courses.filter((c) => c.status === 'publicado').length}</b><span>Cursos publicados</span></div>
      <div class="stat"><b>${S.lessons.length}</b><span>Aulas</span></div><div class="stat"><b>${S.enrollments.length}</b><span>Inscrições</span></div>
      <div class="stat"><b>${rate}%</b><span>Taxa de conclusão</span></div><div class="stat"><b>${overdue}</b><span>Prazos atrasados</span></div>
      <div class="stat"><b>${given}</b><span>Pontos distribuídos</span></div><div class="stat"><b>${pendRed}</b><span>Trocas pendentes</span></div></div>
    <div class="row">${panel(`<h2>Aulas concluídas (14 dias)</h2>${barChart(days)}`)}${panel(`<h2>Conclusão por curso</h2>${bars.length ? bars.map((b) => `<div class="hbar"><span title="${esc(b.c.title)}">${esc(b.c.title.slice(0, 26))}</span><div class="bar"><span style="width:${b.pct}%"></span></div><span>${b.pct}%</span></div>`).join('') : '<p class="muted">Sem cursos.</p>'}`)}</div>
    <div class="row">${panel(`<h2>Top 5 do ranking</h2>${top.length ? top.map((u, i) => `<div class="spread" style="padding:5px 0"><span>${i + 1}. ${esc(u.name)}</span><strong>${u.xp} XP</strong></div>`).join('') : '<p class="muted">Sem alunos.</p>'}`)}
      ${panel(`<h2>Atividade recente</h2>${S.audit.slice(-8).reverse().map((a) => `<div class="small" style="padding:3px 0"><span class="muted">${fmtDate(a.at)}</span> · ${esc(user(a.userId)?.name || '—')}: ${esc(a.action)}</div>`).join('') || '<p class="muted">Nada ainda.</p>'}`)}</div>`;
};
